version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # 15.19.0 ships @babel/preset-typescript without a package.json, so the
      # bundled preprocessor cannot resolve it and every spec dies at 0ms.
      # Remove once a fixed release is out. See PR #162.
      - dependency-name: "cypress"
        versions: ["15.19.0"]
    commit-message:
      prefix: "npm"
      include: "scope"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      docker-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "docker"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "github-actions"
      include: "scope"

