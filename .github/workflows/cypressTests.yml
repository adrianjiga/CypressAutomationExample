name: Run Tests

on:
  schedule:
    - cron: "0 7 * * 1-5" # Every Monday to Friday at 07:00 UTC
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests against"
        required: false
        default: "prod"
        type: choice
        options:
          - prod
      browser:
        description: "Browser to run tests in"
        required: false
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
          - edge
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.group.name }} - ${{ matrix.browser }} - ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: api
            tag: "@api"
          - name: ui
            tag: "@ui"
          - name: webtables
            tag: "@webTables"
          - name: a11y
            tag: "@a11y"
        browser: [chrome, firefox]
        viewport: [desktop]
        exclude:
          - group:
              name: api
            browser: firefox
          # The accessibility audit reads the DOM, not the rendering, so a second engine
          # re-runs identical logic against an identical tree and adds no signal.
          - group:
              name: a11y
            browser: firefox

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ${{ matrix.group.name }} Tests
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          browser: ${{ github.event.inputs.browser || matrix.browser }}
          install: false
          expose: grepTags=${{ matrix.group.tag }},viewport=${{ matrix.viewport }}

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypressResults-${{ matrix.group.name }}-${{ matrix.browser }}-${{ matrix.viewport }}
          path: |
            cypress/screenshots/
            cypress/videos/
            reports/
          if-no-files-found: ignore
          retention-days: 30

  # Responsive testing job for UI tests
  responsiveTests:
    name: Responsive - ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile, tablet]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run UI Tests - ${{ matrix.viewport }}
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          browser: chrome
          install: false
          expose: grepTags=@ui,viewport=${{ matrix.viewport }}

      - name: Upload Responsive Test Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypressResultsResponsive-${{ matrix.viewport }}
          path: |
            cypress/screenshots/
            cypress/videos/
            reports/
          if-no-files-found: ignore
          retention-days: 30

  # Merge and publish reports
  mergeReports:
    name: Merge Test Reports
    needs: [test, responsiveTests]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Download All Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: allResults

      - name: Merge Reports
        run: |
          npm install -g mochawesome-merge mochawesome-report-generator
          mkdir -p reports/final
          find allResults -name "*.json" -path "*/reports/*" | head -20 | xargs mochawesome-merge > reports/final/merged.json || true
          marge reports/final/merged.json --reportDir reports/final --inline || true

      - name: Upload Final Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finalTestReport
          path: reports/final/
          retention-days: 30