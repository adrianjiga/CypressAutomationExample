name: Run Tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test - ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [api, ui]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        uses: cypress-io/github-action@v6
        with:
          install: true
      
      - name: Run Cypress Tests
        uses: cypress-io/github-action@v6
        with:
          browser: 'chrome'
          headed: false
          install: false
          record: false
          group: ${{ matrix.group }}
        continue-on-error: true

      - name: Upload Cypress Videos and Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-${{ matrix.group }}
          path: reports/
          retention-days: 60