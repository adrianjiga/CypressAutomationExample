name: Run Tests

on:
  schedule:
    - cron: '0 7 * * 1-5'  # Every Monday to Friday at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test - ${{ matrix.group.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: 
          - name: api
            tag: '@api'
          - name: ui
            tag: '@ui'
          - name: webtables
            tag: '@webTables'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run ${{ matrix.group.name }} Tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          env: grepTags=${{ matrix.group.tag }}

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-results-${{ matrix.group.name }}
          path: |
            cypress/screenshots/
            cypress/videos/
            reports/
          if-no-files-found: ignore
          retention-days: 30