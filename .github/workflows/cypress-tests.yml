name: Run Tests

on:
  schedule:
    - cron: "0 7 * * 1-5" # Every Monday to Friday at 07:00 UTC
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests against"
        required: false
        default: "prod"
        type: choice
        options:
          - prod
      browser:
        description: "Browser to run tests in"
        required: false
        default: "chrome"
        type: choice
        options:
          - chrome
          - firefox
          - edge
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.group.name }} - ${{ matrix.browser }} - ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: api
            tag: "@api"
          - name: ui
            tag: "@ui"
          - name: webtables
            tag: "@webTables"
        browser: [chrome, firefox]
        viewport: [desktop]
        exclude:
          - group:
              name: api
            browser: firefox
          - group:
              name: api
            viewport: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ${{ matrix.group.name }} Tests
        uses: cypress-io/github-action@e44ee0fa67251ab7e2d854d85b3a466577f47d14 # v7.1.3
        with:
          browser: ${{ github.event.inputs.browser || matrix.browser }}
          install: false
        env:
          GREP_TAGS: ${{ matrix.group.tag }}
          TEST_ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
          TEST_VIEWPORT: ${{ matrix.viewport }}

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cypress-results-${{ matrix.group.name }}-${{ matrix.browser }}-${{ matrix.viewport }}
          path: |
            cypress/screenshots/
            cypress/videos/
            reports/
          if-no-files-found: ignore
          retention-days: 30

  # Responsive testing job for UI tests
  responsive-tests:
    name: Responsive - ${{ matrix.viewport }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile, tablet]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run UI Tests - ${{ matrix.viewport }}
        uses: cypress-io/github-action@e44ee0fa67251ab7e2d854d85b3a466577f47d14 # v7.1.3
        with:
          browser: chrome
          install: false
        env:
          GREP_TAGS: "@ui"
          TEST_VIEWPORT: ${{ matrix.viewport }}

      - name: Upload Responsive Test Artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cypress-results-responsive-${{ matrix.viewport }}
          path: |
            cypress/screenshots/
            cypress/videos/
            reports/
          if-no-files-found: ignore
          retention-days: 30

  # Merge and publish reports
  merge-reports:
    name: Merge Test Reports
    needs: [test, responsive-tests]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "20"

      - name: Download All Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: all-results

      - name: Merge Reports
        run: |
          npm install -g mochawesome-merge mochawesome-report-generator
          mkdir -p reports/final
          find all-results -name "*.json" -path "*/reports/*" | head -20 | xargs mochawesome-merge > reports/final/merged.json || true
          marge reports/final/merged.json --reportDir reports/final --inline || true

      - name: Upload Final Report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: final-test-report
          path: reports/final/
          retention-days: 30