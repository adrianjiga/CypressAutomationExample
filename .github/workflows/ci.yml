name: Run CI
permissions:
  contents: read
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install Dependencies
              run: npm install
            
            - name: Run Linter
              run: npm run lint
            
            - name: Format Code
              run: npm run format:check

            - name: Run Typecheck
              run: npm run typecheck

            - name: Verify Cypress setup
              run: npx cypress verify

            - name: Run smoke tests
              uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
              with:
                  browser: chrome
                  publish-summary: true
                  install: false
                  expose: grepTags=@smoke
            
            

            
